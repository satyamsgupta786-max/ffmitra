services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ffmitra-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ffmitra-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"